name: encrypt
version: 5.0.4
description: A set of high-level APIs over PointyCastle for two-way cryptography.
repository: https://github.com/leocavalcante/encrypt

executables:
  secure-random:

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  args: ^2.7.0
  asn1lib: ^1.6.2
  clock: ^1.1.2
  collection: ^1.19.0
  crypto: ^3.0.6
  pointycastle: ^4.0.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.15

false_secrets:
  - /test/*.pem
